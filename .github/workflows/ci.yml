name: contract-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  direct-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static preflight
        run: python scripts/preflight.py
      - name: Install Direct Mode dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-test.txt
      - name: Compile Python sources
        run: python -m py_compile contracts/diversityproof.py tests/direct/test_diversityproof.py scripts/preflight.py scripts/deploy_studionet.py
      - name: Run Direct Mode suite
        run: pytest tests/direct -q
